name: NAS Windows release

# Builds the Windows x64 installer for an NAS tag (nas-v<semver>) and attaches
# it to a DRAFT GitHub release. Drafts are invisible to electron-updater, so
# publishing the draft in the GitHub UI is the approval step that makes the
# build available to installed clients.

on:
  push:
    tags:
      - 'nas-v*'
      - 'v0.23.0-nas.1'
      - 'v*-nas*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run postinstall
        run: pnpm tsx scripts/postinstall.ts

      - name: Verify
        run: |
          pnpm run lint
          pnpm --filter @muyajs/core test
          pnpm --filter marktext run test:unit

      - name: Build installer
        run: pnpm --filter marktext run build:win:x64

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem -Path dist -Filter 'nas-markdown-editor-win-x64-*-setup.exe' | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Encoding ascii -Append dist/SHA256SUMS.txt
          }

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "NAS Markdown Editor $GITHUB_REF_NAME" \
            --notes "Draft build. Publish to make it available to the in-app updater." \
            dist/nas-markdown-editor-win-x64-*-setup.exe \
            dist/nas-markdown-editor-win-x64-*-setup.exe.blockmap \
            dist/latest.yml \
            dist/SHA256SUMS.txt
